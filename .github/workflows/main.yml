name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumina-reporting/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lumina-reporting/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watchAll=false --passWithNoTests

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumina-reporting/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lumina-reporting/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
