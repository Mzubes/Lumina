databases:
  - name: lumina-db
    plan: free
    databaseName: lumina
    user: lumina

services:
  - type: web
    name: lumina-api
    runtime: python
    plan: free
    rootDir: lumina-reporting/backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lumina-db
          property: connectionString
      # Fill in once lumina-frontend has a URL (see README "Deploy to Render").
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: lumina-frontend
    runtime: static
    rootDir: lumina-reporting/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      # Fill in once lumina-api has a URL (see README "Deploy to Render").
      - key: REACT_APP_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
